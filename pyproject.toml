[project]
name = "xy_coord_match"
description = "Various image processing functions"
requires-python = ">=3.11"
authors = [
    { name = "STScI", email = "help@stsci.edu" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.14",
]
license-files = ["LICENSE"]
dynamic = [
    "version",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Tracker = "https://github.com/spacetelescope/stimage/issues"
Documentation = "https://stscistimage.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/spacetelescope/stimage"

[project.optional-dependencies]
test = [
    'pytest',
    'pytest-cov',
]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "sphinx-rtd-theme",
]

[build-system]
requires = [
    "setuptools >=61",
    "setuptools_scm[toml] >=3.4",
    "wheel",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = [
    "cp311-*",  # build for CPython 3.11 Stable API
    "cp3*t-*",  # build for free-threaded Python
]
test-command = 'python -c "from stimage import xy_coord_match, geomap"'

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.codespell]
ignore-words-list = "Groth"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools_scm]
write_to = "_version.py"
